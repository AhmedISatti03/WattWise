[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wattwise-backend"
version = "0.1.0"
description = "Local review scaffold and explicit synthetic mock API for WattWise"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["setuptools>=75", "wheel>=0.45"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
