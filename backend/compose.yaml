# Optional local PostgreSQL only. Application remains a local Python process.
services:
  database:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: wattwise
      POSTGRES_USER: wattwise
      POSTGRES_PASSWORD: ${WATTWISE_POSTGRES_PASSWORD:?Set WATTWISE_POSTGRES_PASSWORD in your local environment or .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wattwise_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattwise -d wattwise"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  wattwise_postgres:
