<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1340" viewBox="0 0 1500 1340" role="img" aria-labelledby="title desc">
<title id="title">WattWise desktop and phone dashboard wireframes</title>
<desc id="desc">Low fidelity sample dashboards showing household measurements, dated forecast, budget warning, and appliance contributions already included in household totals.</desc>
<defs><style>
